<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #1e293b;
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      background-color: #f1f5f9;
      padding: 30px 15px;
      box-sizing: border-box;
    }

    .letterhead-card {
      max-width: 680px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* ── Letterhead Header ── */
    .letterhead-header {
      padding: 24px 32px 0 32px;
      background-color: #ffffff;
      text-align: center;
    }

    .header-logo {
      max-height: 72px;
      max-width: 180px;
      display: block;
      margin: 0 auto 10px auto;
    }

    .company-name {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: #1e3a5f;
      letter-spacing: -0.3px;
      text-align: center;
    }

    .company-tagline {
      font-size: 12px;
      color: #64748b;
      font-style: italic;
      margin-top: 3px;
      text-align: center;
    }

    .header-divider {
      height: 3px;
      background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 70%, #bfdbfe 100%);
      margin-top: 18px;
    }

    /* ── Body ── */
    .letter-body {
      padding: 28px 32px 24px 32px;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
    }

    .letter-content {
      word-wrap: break-word;
      white-space: pre-line;
    }

    /* ── Footer ── */
    .letter-footer {
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 16px 32px;
      text-align: center;
      font-size: 11.5px;
      color: #64748b;
      line-height: 1.7;
    }

    .letter-footer a {
      color: #1e40af;
      text-decoration: underline;
    }

    .letter-footer p {
      margin: 2px 0;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="letterhead-card">

      <!-- Company Letterhead Header (centered) -->
      <div class="letterhead-header">
        {{companyLogoHtml}}
        <h1 class="company-name">{{companyName}}</h1>
        <div class="company-tagline">{{companyTagline}}</div>
        <div class="header-divider"></div>
      </div>

      <!-- Letter Body -->
      <div class="letter-body">
        <div class="letter-content">{{messageBody}}</div>
      </div>

      <!-- Company Footer -->
      <div class="letter-footer">
        {{companyFooterHtml}}
      </div>

    </div>
  </div>
</body>

</html>
